<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>京阪神八天七夜｜10/13–10/20</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3d2a1a;
      --ink-2: #5a4030;
      --mist: #f3e6c8;
      --paper: #fff8e8;
      --cream: #fffbc6;
      --vermilion: #c44a2f;
      --vermilion-deep: #9a3520;
      --gold: #e8c98a;
      --honey: #c9a46a;
      --teal: #5a7a5e;
      --muted: #7a6555;
      --line: rgba(61, 42, 26, 0.14);
      --shadow: 0 18px 50px rgba(61, 42, 26, 0.14);
      --wood-deep: #2a1a10;
      --wood-mid: #5c3a22;
      --font-display: "Shippori Mincho", "Noto Serif TC", serif;
      --font-body: "Zen Kaku Gothic New", "Noto Sans TC", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --pattern: url("images/rilakkuma_pattern_bg.webp");
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background-color: var(--cream);
      background-image: var(--pattern);
      background-repeat: repeat;
      background-size: 380px auto;
      background-attachment: fixed;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--teal); }
    button { font: inherit; }

    /* —— Hero：木紋看板 —— */
    .hero {
      position: relative;
      min-height: clamp(22rem, 48svh, 32rem);
      display: grid;
      align-items: center;
      overflow: hidden;
      color: #f7efe3;
      background: var(--wood-deep);
      box-shadow:
        inset 0 -18px 40px rgba(20, 10, 4, 0.35),
        0 12px 28px rgba(42, 26, 16, 0.28);
    }
    .hero__media {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          105deg,
          rgba(28, 16, 8, 0.55) 0%,
          rgba(42, 26, 16, 0.28) 42%,
          rgba(28, 16, 8, 0.5) 100%
        ),
        url("images/wood_grain_hero.png") center / cover no-repeat;
      transform: scale(1.04);
      animation: heroZoom 16s var(--ease) forwards;
    }
    .hero__grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 30% 60%, transparent 40%, rgba(18, 10, 4, 0.35) 100%),
        linear-gradient(180deg, rgba(255, 230, 180, 0.08) 0%, transparent 35%, rgba(20, 10, 4, 0.25) 100%);
      mix-blend-mode: soft-light;
      opacity: 0.9;
    }
    .hero__plank {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 220, 160, 0.22) 20%,
        rgba(90, 55, 30, 0.55) 50%,
        rgba(255, 220, 160, 0.22) 80%,
        transparent 100%
      );
      opacity: 0.7;
    }
    .hero__plank--top { top: 0; }
    .hero__plank--bottom { bottom: 0; }
    .hero__content {
      position: relative;
      z-index: 1;
      width: min(1100px, calc(100% - 2.5rem));
      margin: 2.8rem auto;
      padding: 0;
    }
    .hero__brand {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.08;
      margin: 0 0 0.85rem;
      color: #faf3e6;
      text-shadow:
        0 1px 0 rgba(255, 230, 180, 0.25),
        0 2px 4px rgba(20, 10, 4, 0.55),
        0 8px 24px rgba(20, 10, 4, 0.35);
      opacity: 0;
      transform: translateY(28px);
      animation: rise 1s var(--ease) 0.15s forwards;
    }
    .hero__headline {
      margin: 0 0 0.7rem;
      font-size: clamp(0.95rem, 2.2vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--gold);
      text-shadow: 0 1px 2px rgba(20, 10, 4, 0.45);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1s var(--ease) 0.35s forwards;
    }
    .hero__lead {
      margin: 0 0 1.5rem;
      max-width: 30rem;
      color: rgba(247, 239, 227, 0.88);
      font-size: 0.98rem;
      text-shadow: 0 1px 3px rgba(20, 10, 4, 0.4);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1s var(--ease) 0.5s forwards;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 1.35rem;
      border: 1px solid rgba(61, 42, 26, 0.14);
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      box-shadow: 0 6px 18px rgba(42, 26, 16, 0.22);
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1s var(--ease) 0.65s forwards;
      transition: filter 0.25s var(--ease), transform 0.25s var(--ease), background 0.25s var(--ease);
    }
    .hero__cta:hover {
      filter: none;
      transform: translateY(-2px);
      background: #fff8d0;
    }
    .hero__meta {
      position: absolute;
      top: 1.25rem;
      right: 1.4rem;
      z-index: 2;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      color: rgba(247, 239, 227, 0.78);
      text-shadow: 0 1px 2px rgba(20, 10, 4, 0.5);
      opacity: 0;
      animation: rise 1s var(--ease) 0.8s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroZoom {
      to { transform: scale(1); }
    }

    /* —— Day nav —— */
    .day-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 251, 198, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .day-nav {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      scrollbar-width: none;
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 0.75rem 0;
    }
    .day-nav::-webkit-scrollbar { display: none; }
    .day-nav button {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 0.15rem;
      width: 7.6rem;
      min-height: 3.35rem;
      box-sizing: border-box;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      white-space: nowrap;
    }
    .day-nav button .day-id {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      min-height: 1.15rem;
    }
    .day-nav button .day-id strong {
      display: block;
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--ink);
      font-weight: 700;
      line-height: 1;
    }
    .day-nav button .day-icon {
      width: 1.15rem;
      height: 1.15rem;
      object-fit: contain;
      flex: 0 0 auto;
      display: block;
    }
    .day-nav button .day-label {
      display: block;
      width: 100%;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .day-nav button[aria-selected="true"] {
      background: var(--wood-mid);
      color: rgba(247,239,227,0.75);
      box-shadow: inset 0 1px 0 rgba(255,220,160,0.18);
    }
    .day-nav button[aria-selected="true"] .day-id strong { color: #faf3e6; }
    .day-nav button:hover:not([aria-selected="true"]) {
      background: rgba(255, 255, 255, 0.72);
      border-color: var(--line);
    }

    /* —— Main —— */
    main {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.25rem 0 5rem;
    }
    .day-panel {
      display: none;
      opacity: 0;
      transform: translateY(12px);
    }
    .day-panel.is-active {
      display: block;
      animation: panelIn 0.55s var(--ease) forwards;
    }
    @keyframes panelIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .day-head {
      display: grid;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid var(--line);
    }
    .day-head__kicker {
      margin: 0;
      color: var(--vermilion);
      letter-spacing: 0.2em;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .day-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.25;
    }
    .day-head__theme {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .day-notes {
      margin: 0.4rem 0 0;
      padding: 0.85rem 1rem;
      background: linear-gradient(120deg, rgba(196, 74, 47, 0.1), rgba(201, 164, 106, 0.14));
      border-left: 3px solid var(--vermilion);
      color: var(--ink-2);
      font-size: 0.92rem;
    }
    .day-notes li { margin: 0.15rem 0; }

    .outline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 2rem;
      padding: 0;
      list-style: none;
    }
    .outline li {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      max-width: 100%;
      padding: 0.45rem 0.7rem;
      background: rgba(255, 252, 243, 0.92);
      border: 1px solid var(--line);
      border-radius: 0.35rem;
      font-size: 0.86rem;
    }
    .outline .tag {
      flex: 0 0 auto;
      color: var(--vermilion);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }
    .outline .txt {
      color: var(--ink-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 22rem;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 0.9rem;
      padding-left: 1.15rem;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 0.28rem;
      top: 0.4rem;
      bottom: 0.4rem;
      width: 2px;
      background: linear-gradient(180deg, var(--vermilion), var(--teal));
      opacity: 0.45;
    }

    .block {
      position: relative;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
    }
    .block.is-in {
      opacity: 1;
      transform: none;
    }
    .block::before {
      content: "";
      position: absolute;
      left: -1.02rem;
      top: 1.15rem;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--vermilion);
      box-shadow: 0 0 0 3px rgba(214,69,47,0.15);
    }
    .block--transport::before {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(47,111,106,0.15);
    }

    .place {
      background: rgba(255, 252, 243, 0.94);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 1.05rem 1.15rem 1.15rem;
      box-shadow: 0 8px 24px rgba(61, 42, 26, 0.06);
    }
    .place__time {
      margin: 0 0 0.25rem;
      color: var(--vermilion);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .place__title {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .place__title .map-link { font-family: var(--font-body); }
    .rk-logo {
      display: inline-block;
      height: 1.15em;
      width: auto;
      vertical-align: -0.22em;
      margin-left: 0.35rem;
      object-fit: contain;
    }
    .place__title .rk-logo {
      height: 1.35rem;
      vertical-align: middle;
    }
    .items .name .rk-logo { height: 1.15rem; }
    .item__notes .rk-logo,
    .place__notes .rk-logo { height: 1rem; }
    .place__notes,
    .item__notes,
    .transport__notes {
      margin: 0.7rem 0 0;
      padding-left: 1.1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .place__notes li,
    .item__notes li,
    .transport__notes li,
    .transport ol li { margin: 0.2rem 0; }

    .items {
      margin: 0.85rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.55rem;
    }
    .items > li {
      padding: 0.55rem 0.7rem;
      background: rgba(255, 246, 214, 0.65);
      border-radius: 0.45rem;
    }
    .items .name {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      font-weight: 700;
      color: var(--ink);
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      flex: 0 0 auto;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(47,111,106,0.12);
      color: var(--teal);
      white-space: nowrap;
    }
    .map-link:hover { background: rgba(47,111,106,0.2); }
    .map-link--dir {
      background: rgba(214,69,47,0.1);
      color: var(--vermilion-deep);
    }
    .map-link--dir:hover { background: rgba(214,69,47,0.18); }

    .refs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    .refs a {
      font-size: 0.8rem;
      text-decoration: none;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(47,111,106,0.1);
      color: var(--teal);
      font-weight: 500;
    }

    .transport {
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, rgba(90, 122, 94, 0.12), rgba(201, 164, 106, 0.1));
      border: 1px dashed rgba(90, 122, 94, 0.4);
    }
    .transport__label {
      margin: 0 0 0.35rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--teal);
    }
    .transport__route {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.98rem;
    }
    .transport ol {
      margin: 0.55rem 0 0;
      padding-left: 1.15rem;
      color: var(--ink-2);
      font-size: 0.9rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      background: rgba(255, 251, 198, 0.55);
    }

    .maps {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto 2.5rem;
      padding: 0 0 0.5rem;
    }
    .maps__title {
      margin: 0 0 1rem;
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-align: center;
    }
    .maps__list {
      display: grid;
      gap: 1.75rem;
    }
    .maps__item {
      margin: 0;
    }
    .maps__item figcaption {
      margin: 0 0 0.55rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--wood-mid);
    }
    .maps__item img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0.65rem;
      border: 1px solid var(--line);
      background: rgba(255, 252, 243, 0.9);
      box-shadow: 0 10px 28px rgba(61, 42, 26, 0.08);
    }

    .memo {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto 2.25rem;
    }
    .memo__title {
      margin: 0 0 0.75rem;
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-align: center;
    }
    .memo__body {
      margin: 0;
      padding: 1rem 1.15rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink-2);
      background: rgba(255, 252, 243, 0.92);
      border: 1px solid var(--line);
      border-radius: 0.65rem;
    }

    @media (max-width: 640px) {
      .hero { min-height: 20rem; }
      .hero__content {
        margin: 2.2rem auto;
        padding: 0;
      }
      .hero__meta { top: 0.9rem; right: 1rem; font-size: 0.72rem; }
      .outline .txt { max-width: 14rem; white-space: normal; }
      .day-nav button {
        width: 6.6rem;
        min-height: 3.2rem;
        padding: 0.45rem 0.55rem;
      }
      body { background-size: 280px auto; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="hero__grain" aria-hidden="true"></div>
    <div class="hero__plank hero__plank--top" aria-hidden="true"></div>
    <div class="hero__plank hero__plank--bottom" aria-hidden="true"></div>
    <p class="hero__meta">10/13 — 10/20</p>
    <div class="hero__content">
      <h1 class="hero__brand">京阪神八天七夜</h1>
      <p class="hero__headline">OSAKA · KOBE · KYOTO</p>
      <p class="hero__lead">大阪、神戶、京都。</p>
      <a class="hero__cta" href="#itinerary">查看行程 <span aria-hidden="true">↓</span></a>
    </div>
  </header>

  <div class="day-nav-wrap" id="itinerary">
    <nav class="day-nav" id="dayNav" aria-label="每日行程"></nav>
  </div>

  <main id="dayMain"></main>

  <section class="maps" aria-label="交通路線圖">
    <h2 class="maps__title">交通路線圖</h2>
    <div class="maps__list">
      <figure class="maps__item">
        <figcaption>大阪</figcaption>
        <img src="./images/map-osaka.png" alt="大阪 Metro 全線路線圖" loading="lazy" />
      </figure>
      <figure class="maps__item">
        <figcaption>神戶</figcaption>
        <img src="./images/map-kobe.png" alt="神戶鐵道路線圖" loading="lazy" />
      </figure>
      <figure class="maps__item">
        <figcaption>京都</figcaption>
        <img src="./images/map-kyoto.png" alt="京都市營地下鐵暨沿線景點圖" loading="lazy" />
      </figure>
    </div>
  </section>

  <section class="memo" aria-label="備忘錄">
    <h2 class="memo__title">備忘錄</h2>
    <pre class="memo__body">
大阪遺珠之憾
住宿 : https://7-mori.com/
景點 : 咲洲宇宙塔展望台(周遊卡可用)
拉麵 : 人類皆拉麵Premium(~23:00)
神戶遺珠之憾
燒肉 : 燒肉石田屋
丼飯 : 神戶牛丼 廣重
景點 : 六甲山夜景</pre>
  </section>

  <footer>京阪神八天七夜</footer>

  <script src="./itinerary-data.js"></script>
  <script>
    const THEMES = {
      1: "大阪城・難波",
      2: "環球影城",
      3: "勝尾寺・心齋橋",
      4: "神戶一日",
      5: "宇治・teamLab",
      6: "和服東山",
      7: "嵐山・金閣",
      8: "伏見・返台",
    };

    /** Better Google Maps search queries for known spots */
    const MAP_ALIAS = {
      家: null,
      關西機場: "関西国際空港",
      京阪難波格蘭德酒店: "ホテル京阪 なんば グランデ",
      大阪城: "大阪城",
      "極樂橋換御座船（單買約 1,800 日圓；周遊卡可用）": "大阪城 極楽橋",

    const nav = document.getElementById("dayNav");

    const days = window.ITINERARY || [];

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function linkify(text) {
      return esc(text).replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    function extractMapsUrl(texts) {
      const blob = (texts || []).join("\n");
      const m = blob.match(/https?:\/\/(?:maps\.app\.goo\.gl|www\.google\.[^/\s]+\/maps|goo\.gl\/maps)[^\s)）]+/i);
      return m ? m[0] : null;
    }

    function cleanQuery(name) {
      if (!name) return "";
      let q = String(name).trim();
      if (Object.prototype.hasOwnProperty.call(MAP_ALIAS, q)) return MAP_ALIAS[q];
      // strip long Chinese descriptions after fullwidth dash
      q = q.split("－")[0].trim();
      // prefer Japanese inside （...）
      const jp = q.match(/（([^）]*[\u3040-\u30ff\u4e00-\u9fff][^）]*)）/);
      if (jp) {
        const inner = jp[1].split("／")[0].trim();
        if (inner && !/預約|約 |單買|週/.test(inner)) return inner;
      }
      // drop （預約…） / time ranges
      q = q.replace(/（[^）]*預約[^）]*）/g, "").replace(/（約[^）]*）/g, "").trim();
      q = q.replace(/（單買[^）]*）/g, "").trim();
      if (Object.prototype.hasOwnProperty.call(MAP_ALIAS, q)) return MAP_ALIAS[q];
      // fuzzy alias: key contained in name
      for (const [k, v] of Object.entries(MAP_ALIAS)) {
        if (k.length >= 2 && q.includes(k) && v) return v;
      }
      return q || null;
    }

    function mapsSearchUrl(name, notes) {
      const existing = extractMapsUrl(notes);
      if (existing) return existing;
      const q = cleanQuery(name);
      if (!q || q === "家" || /之後補|XX:XX/.test(q)) return null;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }

    function mapsDirUrl(fromName, toName) {
      const origin = cleanQuery(fromName);
      const dest = cleanQuery(toName);
      if (!origin || !dest) return null;
      if (origin === "家" || dest === "家") {
        // flight legs: still link destination / origin airport search if one side is home
        const only = origin === "家" ? dest : origin;
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(only)}`;
      }
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(
        origin
      )}&destination=${encodeURIComponent(dest)}&travelmode=transit`;
    }

    function mapBtn(url, label, dir) {
      if (!url) return "";
      const cls = dir ? "map-link map-link--dir" : "map-link";
      return `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(
        label
      )}</a>`;
    }

    function rkLogo(text) {
      if (!String(text || "").includes("拉拉熊")) return "";
      return `<img class="rk-logo" src="./images/rilakkuma_logo.png" alt="" />`;
    }

    function hasRilakkuma(text) {
      return String(text || "").includes("拉拉熊");
    }

    /** 大標本身或底下小標／備註有拉拉熊時，大標後顯示 logo */
    function rkLogoForPlace(sec) {
      if (hasRilakkuma(sec.title) || (sec.notes || []).some(hasRilakkuma)) {
        return rkLogo("拉拉熊");
      }
      for (const it of sec.items || []) {
        if (hasRilakkuma(it.name) || (it.notes || []).some(hasRilakkuma)) {
          return rkLogo("拉拉熊");
        }
      }
      return "";
    }

    function notesList(notes) {
      if (!notes?.length) return "";
      return `<ul class="place__notes">${notes.map((n) => `<li>${linkify(n)}</li>`).join("")}</ul>`;
    }

    function samePlace(title, item) {
      const norm = (s) =>
        String(s || "")
          .replace(/（預約[^）]*）/g, "")
          .replace(/（約[^）]*）/g, "")
          .replace(/（\d{1,2}:\d{2}[^）]*）/g, "")
          .split("－")[0]
          .trim()
          .replace(/\s+/g, " ");
      const isUsj = (s) => {
        const x = String(s || "");
        return (
          x === "USJ" ||
          /ユニバーサル/.test(x) ||
          /環球影城/.test(x) ||
          /^環球(?!状|狀)/.test(x)
        );
      };
      const t = norm(title);
      const n = norm(item);
      if (!t || !n) return false;
      if (t === n) return true;
      if (n.startsWith(t + "（") || n.startsWith(t + "(")) return true;
      if (t.startsWith(n + "（") || t.startsWith(n + "(")) return true;
      if (isUsj(t) && isUsj(n)) return true;
      if (t.includes("teamLab") && n.includes("teamLab")) {
        return norm(t.split("（")[0]) === norm(n.split("（")[0]);
      }
      return false;
    }

    /**
     * 1) 小標與大標相同（含 USJ／環球）→ 去掉小標
     * 2) 只有一個小標 → 去掉小標
     * 以上情況大標顯示地圖；小標備註併入大標備註區
     */
    function resolvePlaceItems(sec) {
      const items = sec.items || [];
      if (!items.length) {
        return { visibleItems: [], mapOnTitle: true, extraNotes: [] };
      }
      if (items.length === 1) {
        return {
          visibleItems: [],
          mapOnTitle: true,
          extraNotes: items[0].notes || [],
        };
      }
      const extraNotes = [];
      const visibleItems = [];
      for (const it of items) {
        if (samePlace(sec.title, it.name) || samePlace(sec.time, it.name)) {
          if (it.notes?.length) extraNotes.push(...it.notes);
        } else {
          visibleItems.push(it);
        }
      }
      if (!visibleItems.length) {
        return { visibleItems: [], mapOnTitle: true, extraNotes };
      }
      return { visibleItems, mapOnTitle: false, extraNotes };
    }

    function placeAnchorName(sec) {
      if (!sec || sec.kind !== "place") return null;
      const { visibleItems, mapOnTitle } = resolvePlaceItems(sec);
      if (!mapOnTitle && visibleItems.length) {
        return cleanQuery(visibleItems[0].name) || visibleItems[0].name;
      }
      return cleanQuery(sec.title) || sec.title;
    }

    function findPlaceSection(sections, label) {
      if (!label || !sections?.length) return null;
      const needle = String(label).trim();
      let best = null;
      let bestScore = 0;
      for (const sec of sections) {
        if (sec.kind !== "place") continue;
        let score = 0;
        if (samePlace(sec.title, needle) || samePlace(needle, sec.title)) score = 100;
        else if (sec.time && (samePlace(sec.time, needle) || samePlace(needle, sec.time)))
          score = 90;
        else if (sec.title.includes(needle) || needle.includes(sec.title.split("（")[0].trim()))
          score = 70;
        else if (
          (sec.items || []).some(
            (it) =>
              samePlace(it.name, needle) ||
              it.name.includes(needle) ||
              needle.includes(it.name.split("（")[0].trim())
          )
        )
          score = 80;
        if (score > bestScore) {
          bestScore = score;
          best = sec;
        }
      }
      return best;
    }

    function transportDirUrl(sec, sections, index) {
      let fromSec = findPlaceSection(sections, sec.from);
      let toSec = findPlaceSection(sections, sec.to);
      if (!fromSec) {
        for (let i = index - 1; i >= 0; i--) {
          if (sections[i].kind === "place") {
            fromSec = sections[i];
            break;
          }
        }
      }
      if (!toSec) {
        for (let i = index + 1; i < sections.length; i++) {
          if (sections[i].kind === "place") {
            toSec = sections[i];
            break;
          }
        }
      }
      const origin = placeAnchorName(fromSec) || cleanQuery(sec.from) || sec.from;
      const dest = placeAnchorName(toSec) || cleanQuery(sec.to) || sec.to;
      if (!origin || !dest) return null;
      if (origin === "家" || dest === "家") {
        const only = origin === "家" ? dest : origin;
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(only)}`;
      }
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(
        origin
      )}&destination=${encodeURIComponent(dest)}&travelmode=transit`;
    }

    function renderItems(items, sectionTitle, sectionTime) {
      if (!items?.length) return "";
      const sorted = [...items].sort((a, b) => {
        const am =
          samePlace(sectionTitle, a.name) || samePlace(sectionTime, a.name) ? 0 : 1;
        const bm =
          samePlace(sectionTitle, b.name) || samePlace(sectionTime, b.name) ? 0 : 1;
        return am - bm;
      });
      return `<ul class="items">${sorted
        .map((it) => {
          const url = mapsSearchUrl(it.name, it.notes);
          return `<li>
            <div class="name">${esc(it.name)}${mapBtn(url, "地圖")}</div>
            ${
              it.notes?.length
                ? `<ul class="item__notes">${it.notes
                    .map((n) => `<li>${linkify(n)}</li>`)
                    .join("")}</ul>`
                : ""
            }
          </li>`;
        })
        .join("")}</ul>`;
    }

    function renderRefs(refs) {
      if (!refs?.length) return "";
      return `<div class="refs">${refs
        .map(
          (u, i) =>
            `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">參考 ${i + 1}</a>`
        )
        .join("")}</div>`;
    }

    function renderSection(sec, sections, index) {
      if (sec.kind === "transport") {
        const dirUrl = transportDirUrl(sec, sections, index);
        return `<article class="block block--transport">
          <div class="transport">
            <p class="transport__label">交通</p>
            <p class="transport__route"><span>${esc(sec.title)}</span>${mapBtn(
              dirUrl,
              "路線",
              true
            )}</p>
            ${
              sec.steps?.length
                ? `<ol>${sec.steps.map((s) => `<li>${linkify(s)}</li>`).join("")}</ol>`
                : ""
            }
            ${
              sec.notes?.length
                ? `<ul class="transport__notes">${sec.notes
                    .map((n) => `<li>${linkify(n)}</li>`)
                    .join("")}</ul>`
                : ""
            }
          </div>
        </article>`;
      }

      // 單一／與大標相同的小標會收合，改由大標顯示地圖
      const { visibleItems, mapOnTitle, extraNotes } = resolvePlaceItems(sec);
      const placeUrl = mapOnTitle
        ? mapsSearchUrl(sec.title, [...(sec.notes || []), ...extraNotes])
        : null;
      const allNotes = [...(sec.notes || []), ...extraNotes];
      return `<article class="block">
        <div class="place">
          ${sec.time ? `<p class="place__time">${esc(sec.time)}</p>` : ""}
          <h3 class="place__title"><span>${esc(sec.title)}${rkLogoForPlace(sec)}</span>${mapBtn(placeUrl, "地圖")}</h3>
          ${notesList(allNotes)}
          ${renderItems(visibleItems, sec.title, sec.time)}
          ${renderRefs(sec.refs)}
        </div>
      </article>`;
    }

    function renderDay(day) {
      const theme = day.theme || THEMES[day.day] || "";
      return `<section class="day-panel" id="day-${day.day}" data-day="${day.day}" hidden>
        <header class="day-head">
          <p class="day-head__kicker">DAY ${String(day.day).padStart(2, "0")} · ${esc(day.date)}</p>
          <h2>${esc(theme || day.title)}</h2>
          <p class="day-head__theme">${esc(day.title)}</p>
          ${
            day.notes?.length
              ? `<ul class="day-notes">${day.notes
                  .map((n) => `<li>${linkify(n)}</li>`)
                  .join("")}</ul>`
              : ""
          }
        </header>
        <ul class="outline">
          ${day.summary
            .filter((s) => s.text)
            .map(
              (s) =>
                `<li><span class="tag">${esc(s.label)}</span><span class="txt" title="${esc(
                  s.text
                )}">${esc(s.text)}</span></li>`
            )
            .join("")}
        </ul>
        <div class="timeline">
          ${day.sections.map((sec, i) => renderSection(sec, day.sections, i)).join("")}
        </div>
      </section>`;
    }

    function selectDay(n) {
      const buttons = [...nav.querySelectorAll("button")];
      buttons.forEach((btn) => {
        const on = Number(btn.dataset.day) === n;
        btn.setAttribute("aria-selected", on ? "true" : "false");
      });
      [...main.querySelectorAll(".day-panel")].forEach((panel) => {
        const on = Number(panel.dataset.day) === n;
        panel.classList.toggle("is-active", on);
        panel.hidden = !on;
      });
      observeBlocks();
      history.replaceState(null, "", `#day-${n}`);
    }

    function observeBlocks() {
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) e.target.classList.add("is-in");
          });
        },
        { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }
      );
      main.querySelectorAll(".day-panel.is-active .block").forEach((el) => {
        el.classList.remove("is-in");
        io.observe(el);
      });
    }

    const RILAKKUMA_DAYS = new Set([3, 4, 6, 7, 8]);

    nav.innerHTML = days
      .map((d) => {
        const label = d.theme || THEMES[d.day] || "";
        const icon = RILAKKUMA_DAYS.has(d.day)
          ? `<img class="day-icon" src="./images/rilakkuma.png" alt="" width="18" height="18" />`
          : "";
        return `<button type="button" data-day="${d.day}" aria-selected="false">
          <span class="day-id"><strong>D${d.day}</strong>${icon}</span>
          <span class="day-label">${esc(label)}</span>
        </button>`;
      })
      .join("");

    main.innerHTML = days.map(renderDay).join("");

    nav.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-day]");
      if (!btn) return;
      selectDay(Number(btn.dataset.day));
      document.getElementById("itinerary").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const hashDay = Number((location.hash.match(/day-(\d+)/) || [])[1]);
    selectDay(days.some((d) => d.day === hashDay) ? hashDay : days[0]?.day || 1);
  </script>
</body>
</html>
