    const daysEl = document.getElementById("days");

    let day = "D1";

    function btn(label, pressed, onClick) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.setAttribute("aria-pressed", pressed ? "true" : "false");
      b.addEventListener("click", onClick);
      return b;
    }
    function render() {
      daysEl.replaceChildren();
      DAYS.forEach((d) => {
        daysEl.appendChild(btn(d.label, d.id === day, () => {
          day = d.id;
          const first = SITES.find((s) => s.day === day);
          if (first) siteId = first.id;
          render();
        }));
      });
      const list = SITES.filter((s) => s.day === day);
      const site = list.find((s) => s.id === siteId) || list[0];
      sitesEl.replaceChildren();
      list.forEach((s) => {
        sitesEl.appendChild(btn(s.list, s.id === site.id, () => {
          siteId = s.id;
          render();
        }));
      });
      const img = site.image
        ? '<img alt="' + site.caption.replaceAll('"','') + '" src="' + site.image + '" />'
        : "";
      cardEl.innerHTML =
        img +
        '<p class="cap">' + site.caption + "</p>" +
        '<div class="body">' +
          "<h2>" + site.name + "</h2>" +
          '<p class="jp">' + site.jp + "</p>" +
          '<p class="hook">' + site.hook + "</p>" +
          '<div class="stats">' +
            stat(site.when, "什麼時候") +
            stat(site.who, "誰蓋的") +
            stat(site.now, "現在看到的") +
            stat(site.honzon, "主尊或記號") +
          "</div>" +
          '<div class="cols">' +
            "<section><h3>怎麼來的</h3><p>" + site.origin + "</p></section>" +
            "<section><h3>大事件</h3><p>" + site.events + "</p></section>" +
          "</div>" +
          "<section><h3>雕像、動物、建築代表什麼</h3><p>" + site.symbols + "</p></section>" +
          findsHtml(site.id) +
          '<div class="spot"><strong>走到的時候先看這個。</strong> ' + site.spot + "</div>" +
        "</div>";
      cardEl.querySelectorAll("img").forEach((image) => {
        image.addEventListener("error", () => image.remove());
      });
    }
    function stat(value, label) {
      return '<div class="stat"><b>' + value + "</b><span>" + label + "</span></div>";

    function findsHtml(id) {

        return '<figure class="find"><img alt="' + item.name + '" src="' + item.image + '" />' +

      }).join("");
      return '<section><h3>現場要找的雕像</h3><div class="finds">' + cards + "</div></section>";
    }
